<style>
:root{color-scheme:light;--ink:#18302f;--muted:#637674;--line:#dce4df;--paper:#f3f5f1;--green:#136954;--pale:#e5f0e9;--amber:#a35e17}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a.link{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:8px 13px;background:#fff;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}button:hover,a.link:hover{border-color:var(--green);background:#f0f6f1}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#0a5543}button.quiet{background:transparent}input,select{padding:9px 10px;border:1px solid #cdd8d1;border-radius:6px;background:#fff;color:var(--ink);min-width:0}input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #58a18a;outline-offset:2px}header{padding:22px 32px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:14px}.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:23px;border-radius:10px}h1{font-size:21px;letter-spacing:.5px;margin:0}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0}.sub,.muted{color:var(--muted)}.sub{font-size:12px;margin-top:2px}.top-actions{display:flex;gap:8px;align-items:center}.workspace{max-width:1680px;padding:24px 32px;margin:auto}.steps{display:flex;gap:28px;margin-bottom:20px;flex-wrap:wrap;color:var(--muted);font-size:13px}.steps b{color:var(--green);font-size:11px;border:1px solid #b8c9be;padding:3px 6px;margin-right:6px;border-radius:4px}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:9px;padding:13px 18px;display:flex;align-items:center;justify-content:space-between}.stat strong{font-size:26px;font-weight:600}.stat span{font-size:12px;color:var(--muted)}.columns{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.panel-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.drop{margin:16px;border:1px dashed #88ad98;border-radius:8px;background:#f7faf6;padding:20px 12px;text-align:center;transition:.15s}.drop.drag{background:#dcefe3;border-color:var(--green)}.drop .plus{font-size:29px;line-height:1;color:var(--green);margin-bottom:8px}.drop button{margin:12px 0 6px}.drop p{margin:0;font-size:12px;color:var(--muted)}.filters{display:flex;gap:7px;padding:0 16px 14px}.filters input{width:100%}.filters select{max-width:120px}.task-list{max-height:670px;overflow:auto;border-top:1px solid var(--line)}.task{width:100%;border:0;border-bottom:1px solid #edf0eb;border-radius:0;padding:13px 15px;display:flex;text-align:left;justify-content:flex-start;gap:11px;background:#fff}.task.active{background:#eaf2eb;box-shadow:inset 3px 0 var(--green)}.task img{width:72px;height:48px;object-fit:contain;background:white;border:1px solid #edf0eb;border-radius:4px}.task-info{min-width:0;flex:1}.task-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600}.task .sub{margin-top:5px}.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;background:#edf0ed;color:#61706b;white-space:nowrap}.badge.green{background:#dceee2;color:#216046}.badge.amber{background:#fff0d9;color:#965617}.badge.red{background:#fae5e2;color:#a93e33}.badge.blue{background:#e3eff7;color:#3e6c8b}.empty{padding:55px 22px;text-align:center;color:var(--muted)}.empty svg{display:block;margin:0 auto 18px;color:#9ab2a5}.detail-body{padding:20px}.detail-title{min-width:0;overflow-wrap:anywhere}.detail-title .sub{margin-top:5px}.progress{display:flex;gap:5px;padding:14px 20px;border-bottom:1px solid var(--line);background:#fafbf8}.progress span{flex:1;font-size:11px;color:#88938c;position:relative;padding-top:9px}.progress span:before{content:"";height:3px;background:#e4e9e2;position:absolute;top:0;left:0;right:0}.progress .done{color:var(--green)}.progress .done:before{background:#31836c}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.preview{border:1px solid var(--line);border-radius:7px;overflow:hidden}.preview-label{font-size:11px;padding:7px 11px;background:#f7f9f5;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.preview-stage{height:215px;display:grid;place-items:center;padding:12px;background:repeating-conic-gradient(#f6f7f3 0% 25%,white 0% 50%) 50%/18px 18px}.preview img{max-width:100%;max-height:190px;object-fit:contain}.preview-empty{font-size:12px;color:#7d8c81}.notice{padding:10px 13px;background:#fff4df;color:#835515;border:1px solid #efdfbd;border-radius:6px;font-size:12px;margin-bottom:14px;overflow-wrap:anywhere}.notice.error{background:#fff0ed;border-color:#ebd0c9;color:#9b4437}.notice.info{background:#edf4f0;border-color:#d7e4db;color:#466f5a}.identity{font-size:12px;color:var(--muted);margin-bottom:14px}.search{display:flex;gap:8px;margin:13px 0}.search input{flex:1}.search select{width:90px}.table-wrap{max-height:315px;overflow:auto;border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:#f3f6f0;text-align:left;color:#66766a;font-weight:500;padding:9px 10px;white-space:nowrap}td{padding:10px;border-top:1px solid #e7ece5;vertical-align:middle}tr.chosen{background:#ecf4ed}tbody tr{cursor:pointer}tbody tr:hover{background:#f5f9f2}.vehicle-cell{min-width:200px;max-width:380px}.vehicle-cell strong{font-weight:500;display:block}.vehicle-cell small{display:block;color:var(--muted);font-size:10px;overflow-wrap:anywhere}.dimensions{font-variant-numeric:tabular-nums;white-space:nowrap}.confirm-area{margin-top:15px;background:#f7f9f4;border:1px solid var(--line);border-radius:7px;padding:15px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.measurements{display:flex;gap:22px;flex:1}.measurements small{display:block;color:var(--muted);font-size:11px}.measurements strong{font-size:20px;font-weight:600}.measurements em{font-size:11px;font-style:normal;color:var(--muted);margin-left:3px}.review-check{display:flex;gap:8px;align-items:center;font-size:12px;margin:13px 0}.review-check input{accent-color:var(--green);width:16px;height:16px}.footer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px;flex-wrap:wrap}.footer-actions>div{display:flex;gap:8px;flex-wrap:wrap}.footnote{color:var(--muted);font-size:11px;line-height:1.8;margin-top:17px}.connection{font-size:12px;color:var(--green)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#183b31;color:white;padding:12px 22px;border-radius:8px;box-shadow:0 4px 20px #0002;max-width:90vw;z-index:10}#toast[hidden]{display:none}.master-info{padding:13px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);overflow-wrap:anywhere}.spinner{display:inline-block;width:11px;height:11px;border:2px solid #b4cbbb;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}[hidden]{display:none!important}@media(max-width:1100px){.workspace{padding:18px}.columns{grid-template-columns:285px minmax(0,1fr)}header{padding:18px}.top-actions{flex-wrap:wrap;justify-content:flex-end}.preview-stage{height:160px}.preview img{max-height:140px}.measurements{gap:15px}.search{flex-wrap:wrap}.search input{flex-basis:60%}}@media(max-width:760px){.columns{grid-template-columns:1fr}.task-list{max-height:230px}.overview{gap:7px}.stat{padding:10px}.stat strong{font-size:22px}.steps{gap:12px}.brand .sub{display:none}h1{font-size:16px}.top-actions .connection{display:none}.preview-grid{grid-template-columns:1fr}.preview-stage{height:190px}.preview img{max-height:170px}.detail-body{padding:14px}.top-actions button{font-size:11px;padding:7px}.workspace{padding:12px}.measurements strong{font-size:18px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo" aria-hidden="true">↔</div><div><h1>车辆侧视图 <span class="muted">/ 尺寸工作台</span></h1><div class="sub">素材 · 全量表核对 · 真实尺寸 SVG</div></div></div>
  <div class="top-actions"><span id="connection" class="connection">连接中</span><button id="scan">导入现有 input</button><button id="export-all" class="primary">生成全部已确认</button></div>
</header>
<main class="workspace">
  <div class="steps"><span><b>01</b>拖入图片</span><span><b>02</b>自动匹配全量表</span><span><b>03</b>核对长 / 宽 / 高</span><span><b>04</b>一键生成 SVG</span></div>
  <div class="overview"><div class="stat"><span>素材总数</span><strong id="count-total">0</strong></div><div class="stat"><span>待核对</span><strong id="count-review">0</strong></div><div class="stat"><span>处理中</span><strong id="count-busy">0</strong></div><div class="stat"><span>已输出</span><strong id="count-done">0</strong></div></div>
  <div class="columns">
    <aside class="panel">
      <div class="panel-head"><h2>素材队列</h2><span class="sub">自动保存进度</span></div>
      <div id="drop" class="drop"><div class="plus" aria-hidden="true">＋</div><strong>把车辆图片拖到这里</strong><br><button id="choose">选择图片</button><input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,.avif" multiple hidden><p>JPG / PNG / WebP / AVIF · 单张 ≤ 40 MB<br>拖入后自动匹配，尺寸确认后再生成</p><p id="upload-progress" aria-live="polite"></p></div>
      <div class="filters"><input id="filter-text" placeholder="筛选素材或车型" aria-label="筛选素材或车型"><select id="filter-state" aria-label="筛选状态"><option value="">全部状态</option><option value="review">待核对</option><option value="ready">已确认</option><option value="busy">处理中</option><option value="done">已输出</option><option value="failed">失败</option></select></div>
      <div id="task-list" class="task-list"></div>
      <div class="master-info"><strong>全量表</strong> <span id="master-status">加载中…</span><button id="refresh-master" class="quiet" style="float:right;padding:0 6px;font-size:11px">刷新</button><div id="master-source"></div></div>
    </aside>
    <section id="detail" class="panel"><div class="empty"><svg width="80" height="50" viewBox="0 0 80 50" fill="none" aria-hidden="true"><path d="M5 35V23h12l12-13h23l13 13h10v12H5Z" stroke="currentColor" stroke-width="2"/><circle cx="21" cy="35" r="8" fill="white" stroke="currentColor" stroke-width="2"/><circle cx="60" cy="35" r="8" fill="white" stroke="currentColor" stroke-width="2"/></svg><h2>从一张侧视图开始</h2><p>拖入车辆图片，自动获取全量表中的长宽高。<br>在此核对车型、年份和尺寸，生成毫米单位的 SVG。</p><p class="sub">也可以导入已有 input 素材，逐张匹配和处理。</p></div></section>
  </div>
</main>
<div id="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const busy=new Set(['MATCH_QUEUED','MATCHING','EXPORT_QUEUED','PROCESSING']);
const names={NEW:'待匹配',MATCH_QUEUED:'匹配排队',MATCHING:'正在匹配',NEEDS_REVIEW:'待核对',READY:'已确认',EXPORT_QUEUED:'生成排队',PROCESSING:'正在生成',EXPORTED:'已输出',FAILED:'失败'};
const stages={IMPORTED:'待匹配',WAITING:'等待前序任务',MASTER_TABLE:'读取全量表',IDENTIFY:'识别车辆',REVIEW:'核对三维数据',CONFIRMED:'尺寸已确认',VALIDATE:'检查原图与尺寸',LOAD_IMAGE:'读取原图',QWEN_LOCALIZE:'定位车辆边界',PERSPECTIVE_CROP:'方向归一与裁剪',RENDER_EXPORT:'生成毫米 SVG',DONE:'输出完成',MATCH_FAILED:'匹配失败',EXPORT_FAILED:'生成失败',INTERRUPTED:'运行中断'};
let state={tasks:[],master:{}}, active='', selectedKey='', detailVersion='', uploading=false, toastTimer;
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,6000)}
async function api(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result}
function asset(t,kind,download=false){return `/api/assets/${encodeURIComponent(t.id)}/${kind}${download?'?download=1':''}`}
function badge(t){let color=busy.has(t.status)?'blue':t.status==='FAILED'?'red':t.status==='NEEDS_REVIEW'?'amber':['READY','EXPORTED'].includes(t.status)?'green':'';return `<span class="badge ${color}">${busy.has(t.status)?'<span class="spinner"></span>':''}${esc(names[t.status]||t.status)}</span>`}
function visibleTask(t){const q=$('#filter-text').value.toLowerCase(),f=$('#filter-state').value;return (!q||[t.filename,t.query,t.selected?.dimension_id].join(' ').toLowerCase().includes(q))&&(!f||(f==='review'&&['NEW','NEEDS_REVIEW'].includes(t.status))||(f==='ready'&&t.confirmed&&t.status!=='EXPORTED'&&!busy.has(t.status))||(f==='busy'&&busy.has(t.status))||(f==='done'&&t.status==='EXPORTED')||(f==='failed'&&t.status==='FAILED'))}
function renderList(){const items=state.tasks.filter(visibleTask);$('#task-list').innerHTML=items.length?items.map(t=>`<button class="task ${t.id===active?'active':''}" data-task="${t.id}" aria-pressed="${t.id===active}"><img src="${asset(t,'thumbnail')}" alt="" loading="lazy"><div class="task-info"><div class="task-name" title="${esc(t.filename)}">${esc(t.filename)}</div><div class="sub">${badge(t)} ${esc(stages[t.stage]||'')}</div></div></button>`).join(''):'<div class="empty">暂无素材<br><span class="sub">拖入图片或导入现有 input</span></div>';$('#task-list').querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>{active=el.dataset.task;selectedKey='';detailVersion='';renderList();renderDetail()})}
function renderStats(){const tasks=state.tasks;$('#count-total').textContent=tasks.length;$('#count-review').textContent=tasks.filter(t=>['NEW','NEEDS_REVIEW'].includes(t.status)).length;$('#count-busy').textContent=tasks.filter(t=>busy.has(t.status)).length;$('#count-done').textContent=tasks.filter(t=>t.status==='EXPORTED').length;$('#export-all').disabled=!tasks.some(t=>t.confirmed&&!busy.has(t.status)&&t.status!=='EXPORTED');const m=state.master;$('#master-status').textContent=m.status==='READY'?`${m.vehicles.toLocaleString()} 条 · ${{configured:'配置来源',cache:'离线缓存',local:'本地汇总快照',provided:'测试数据'}[m.mode]||''}`:m.status==='FAILED'?'加载失败':'加载中…';$('#master-source').textContent=m.error||m.source||'';$('#refresh-master').disabled=m.status==='LOADING'}
function renderDetail(force=false){const t=state.tasks.find(t=>t.id===active);if(!t)return;const version=t.id+t.updated_at;if(detailVersion===version&&!force)return;
// Keep search text and selection stable while unrelated tasks update.
let draft=$('#query')?.value,marketDraft=$('#market')?.value,same=detailVersion.startsWith(t.id);detailVersion=version;
if(!t.candidates.some(r=>r.row_key===selectedKey))selectedKey=t.selected?.row_key||t.candidates[0]?.row_key||'';
const locked=busy.has(t.status),chosen=t.candidates.find(r=>r.row_key===selectedKey),done=t.status==='EXPORTED';
let phase=done?4:['EXPORT_QUEUED','PROCESSING'].includes(t.status)?3:t.confirmed?3:t.status==='NEEDS_REVIEW'?2:['MATCHING','MATCH_QUEUED'].includes(t.status)?1:0;
$('#detail').innerHTML=`<div class="panel-head"><div class="detail-title"><h2>${esc(t.filename)}</h2><div class="sub">${t.width_px} × ${t.height_px} px · ${esc(stages[t.stage]||t.stage)}</div></div>${badge(t)}</div>
<div class="progress">${['导入素材','匹配车型','核对三维','生成 SVG'].map((s,i)=>`<span class="${i<=phase?'done':''}">${s}</span>`).join('')}</div>
<div class="detail-body"><div class="preview-grid"><div class="preview"><div class="preview-label">原始素材<a href="${asset(t,'source',true)}" download>下载原图</a></div><div class="preview-stage"><img src="${asset(t,'thumbnail')}" alt="车辆原图"></div></div><div class="preview"><div class="preview-label">${done?'真实尺寸 SVG 预览':'处理结果'}<span>${done?'毫米单位 · 含尺寸标注':''}</span></div><div class="preview-stage">${done?`<img src="${asset(t,'svg')}?v=${encodeURIComponent(t.updated_at)}" alt="真实尺寸 SVG">`:'<span class="preview-empty">确认尺寸并生成后显示</span>'}</div></div></div>
${t.error?`<div class="notice error">${esc(t.error)}</div>`:''}${t.warning?`<div class="notice">${esc(t.warning)}</div>`:''}
${t.ambiguous?'<div class="notice">相近候选存在不同长宽高，请结合市场、年份、车身 / 驾驶室 / 货箱版本选择具体记录。</div>':''}
<h3>核对全量表记录 <span class="sub">尺寸单位：mm</span></h3>
${t.identity?`<div class="identity">识别结果：${esc(t.identity.query)} · 市场 ${esc(t.identity.market||'未指定')} · 置信度 ${Math.round(t.identity.confidence*100)}%</div>`:''}
<form id="search" class="search"><input id="query" aria-label="全量表车型搜索" placeholder="品牌、车型、年份，例如 Ford F-150 2024" value="${esc(same?draft:t.query)}" ${locked?'disabled':''}><select id="market" aria-label="车辆市场" ${locked?'disabled':''}>${['','US','EU','RU','CN','JP','KR'].map(m=>`<option value="${m}" ${m===(same?marketDraft:t.market)?'selected':''}>${m||'全部市场'}</option>`).join('')}</select><button type="submit" ${locked?'disabled':''}>搜索全量表</button><button type="button" id="identify" ${locked?'disabled':''}>识图匹配</button></form>
${t.candidates.length?`<div class="table-wrap"><table><thead><tr><th>选择</th><th>车型 / 年份 / 市场</th><th>长</th><th>宽</th><th>高</th><th>尺码</th><th>匹配</th></tr></thead><tbody>${t.candidates.map(r=>`<tr data-row="${r.row_key}" class="${r.row_key===selectedKey?'chosen':''}"><td><input type="radio" name="candidate" aria-label="选择 ${esc(r.dimension_id)}" value="${r.row_key}" ${r.row_key===selectedKey?'checked':''} ${locked?'disabled':''}></td><td class="vehicle-cell"><strong>${esc(r.name)}</strong><small>${esc(r.dimension_id)} · 来源 ${esc(r.source)}</small></td><td class="dimensions">${r.length_mm}</td><td class="dimensions">${r.width_mm}</td><td class="dimensions">${r.height_mm}</td><td>${esc(r.size)}</td><td>${r.exact?'精确':Math.min(100,Math.round(r.score*100))+'%'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice info">尚无候选。可用车型名称搜索全量表，或点击“识图匹配”。AI 仅识别车型，长宽高均来自全量表。</div>'}
${chosen?`<div class="confirm-area"><div class="measurements">${[['length_mm','车长'],['width_mm','车宽'],['height_mm','车高']].map(([key,label])=>`<div><small>${label}</small><strong>${chosen[key]}</strong><em>mm</em></div>`).join('')}</div><span class="sub">${esc(chosen.market)} · ${esc(chosen.year)} · ${esc(chosen.size)}</span></div><label class="review-check"><input id="review-check" type="checkbox" ${t.confirmed&&t.selected?.row_key===selectedKey?'checked':''} ${locked?'disabled':''}>我已核对车型版本、年份、市场与长宽高</label>`:''}
<div class="footer-actions"><div><button id="confirm" ${locked||!chosen?'disabled':''}>${t.confirmed&&t.selected?.row_key===selectedKey?'重新确认尺寸':'确认尺寸'}</button><button id="export" class="primary" ${locked||!t.confirmed||t.selected?.row_key!==selectedKey?'disabled':''}>${done?'重新生成 SVG':'生成真实尺寸 SVG'}</button></div><div>${done?`<a class="link" href="${asset(t,'svg',true)}" download="${esc(t.filename.replace(/\.[^.]+$/,'.svg'))}">下载 SVG ↓</a><a class="link" href="${asset(t,'review',true)}" download="review.json">核对记录</a>`:''}</div></div>
<div class="footnote">车辆本体按全量表的 <strong>车长 × 车高</strong> 放置，SVG 使用 mm 及对应 viewBox；标注边距会使画板大于车辆本体。<br>车宽用于三维核对与记录，不是侧视图的水平尺寸。SVG 内嵌裁剪图片，不会自动转为矢量轮廓。<br>${esc(state.output_dir)}${!state.api_key_configured?' · 未配置 Qwen Key，精确文件名匹配和手动搜索仍可使用。':''}</div></div>`;
$('#search').onsubmit=e=>{e.preventDefault();action(()=>api('/api/match',{id:t.id,query:$('#query').value,market:$('#market').value}))};
$('#identify').onclick=()=>action(()=>api('/api/match',{id:t.id,market:$('#market').value,use_ai:true}));
$('#detail').querySelectorAll('[data-row]').forEach(row=>row.onclick=()=>{if(locked)return;selectedKey=row.dataset.row;renderDetail(true)});
$('#detail').querySelectorAll('input[name="candidate"]').forEach(radio=>radio.onchange=()=>{selectedKey=radio.value;renderDetail(true)});
$('#confirm').onclick=()=>{if(!$('#review-check')?.checked){toast('请先勾选已核对车型和长宽高');return}action(()=>api('/api/confirm',{id:t.id,row_key:selectedKey}),'尺寸已确认，可以生成 SVG')};
$('#export').onclick=()=>action(()=>api('/api/export',{ids:[t.id]}),'已加入生成队列');
}
async function refresh(){try{const next=await api('/api/state');state=next;$('#connection').textContent='● 本地服务已连接';$('#connection').style.color='';if(!active&&state.tasks.length)active=state.tasks[0].id;renderStats();renderList();renderDetail()}catch(e){$('#connection').textContent='● 本地服务未连接';$('#connection').style.color='#a34437'}}
async function action(fn,message){try{await fn();if(message)toast(message);await refresh()}catch(e){toast(e.message)}}
async function upload(files){if(uploading){toast('当前上传尚未结束，请稍后添加');return}uploading=true;$('#choose').disabled=true;const list=Array.from(files);let ok=0;try{for(let i=0;i<list.length;i++){const f=list[i];$('#upload-progress').textContent=`正在导入 ${i+1} / ${list.length} · ${f.name}`;try{if(f.size>40*1024*1024)throw Error(`${f.name} 超过 40 MB`);const res=await fetch('/api/upload',{method:'POST',headers:{'X-Filename':encodeURIComponent(f.name)},body:f});const data=await res.json();if(!res.ok)throw Error(data.error);active=data.id;detailVersion='';ok++;await refresh()}catch(e){toast(`${f.name}：${e.message}`)}}$('#upload-progress').textContent=`已导入 ${ok} / ${list.length} 张`;toast('图片已导入，正在匹配全量表')}finally{uploading=false;$('#choose').disabled=false;$('#files').value=''}}
$('#choose').onclick=()=>$('#files').click();$('#files').onchange=e=>upload(e.target.files);
const drop=$('#drop');['dragenter','dragover'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>upload(e.dataTransfer.files));window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
$('#filter-text').oninput=renderList;$('#filter-state').onchange=renderList;
$('#scan').onclick=async()=>{const button=$('#scan');button.disabled=true;button.textContent='导入中…';await action(async()=>{const r=await api('/api/scan',{});toast(`新增 ${r.added} 张素材${r.errors.length?'，'+r.errors.length+' 张读取失败':''}。选择素材后搜索或识图匹配。`)});button.disabled=false;button.textContent='导入现有 input'};
$('#refresh-master').onclick=()=>action(()=>api('/api/master/refresh',{}),'已安排刷新全量表；已确认任务会在生成前再次核验尺寸');
$('#export-all').onclick=()=>action(()=>api('/api/export',{ids:state.tasks.filter(t=>t.confirmed&&!busy.has(t.status)&&t.status!=='EXPORTED').map(t=>t.id)}),'已确认任务已加入生成队列');
refresh();setInterval(refresh,1500);
</script>
</body>
</html>
